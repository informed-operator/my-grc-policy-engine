name: ISO 27001 Automated Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run audit automatically every night at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  audit:
    name: Run Telemetry & Policy Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Open Policy Agent (OPA)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "latest"

      - name: 1. Run Rego Unit Tests
        run: |
          echo "=== Running OPA Policy Tests ==="
          opa test policies/ tests/ -v

      - name: 2. Execute GitHub Telemetry Collector
        env:
          GITHUB_TOKEN: ${{ secrets.AUDIT_PAT }}
          # REPLACE 'yourusername' WITH YOUR ACTUAL GITHUB USERNAME
          TARGET_REPOS: "yourusername/iso27001-grc-engine,yourusername/grc-test-target-failing"
        run: |
          echo "=== Collecting Target Telemetry ==="
          python collectors/github_collector.py

      - name: 3. Evaluate Compliance Policy
        run: |
          echo "=== Evaluating Telemetry against ISO 27001 A.8.28 Policy ==="
          if [ ! -f audit_results.json ]; then touch audit_results.json; fi
          opa eval --data policies/ --input input.json "data.iso27001.a8_28.violations" --format pretty > audit_results.json
          cat audit_results.json

      - name: 4. Generate GitHub Step Summary Report
        if: always()
        run: |
          if [ ! -f audit_results.json ]; then touch audit_results.json; fi
          echo "# 🛡️ ISO 27001 Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "### Controls Evaluated: **A.8.28 (Secure Coding)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Findings Output:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat audit_results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 5. Archive Telemetry & Audit Evidence
        uses: actions/upload-artifact@v4
        with:
          name: iso27001-audit-evidence
          path: |
            input.json
            audit_results.json
          retention-days: 30